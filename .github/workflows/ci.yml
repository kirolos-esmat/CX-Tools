name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build & Verify on macOS
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile cxtool
        run: |
          swiftc -O cx_shortcut_mgr.swift -o cxtool
          chmod +x cxtool

      - name: Verify Version
        run: |
          ./cxtool --version
          test "$(./cxtool --version)" = "cxtool 1.1.3"

      - name: Verify CLI Help
        run: |
          ./cxtool --help

      - name: Verify Environment Doctor Check
        run: |
          ./cxtool doctor

      - name: Verify Clean User First-Run Portability
        run: |
          TMP_HOME="$(mktemp -d)"
          HOME="$TMP_HOME" ./cxtool doctor
          test -f "$TMP_HOME/.cxtool.json"
          if grep -qE "exampleuser|ExternalDrive" "$TMP_HOME/.cxtool.json"; then
            echo "❌ Leaked personal paths in default config!"
            exit 1
          fi
          echo "✅ Default config is generic and clean."
          rm -rf "$TMP_HOME"

      - name: Verify CLI Exit Codes
        run: |
          set +e
          # Exit code 0: Success / Help / Version
          ./cxtool --version > /dev/null
          test $? -eq 0 || (echo "Failed exit code 0" && exit 1)

          # Exit code 2: Usage / missing required argument
          ./cxtool inspect > /dev/null 2>&1
          test $? -eq 2 || (echo "Failed exit code 2" && exit 1)

          # Exit code 3: Target not found
          ./cxtool inspect "DefinitelyNonExistentGameXYZ123" > /dev/null 2>&1
          test $? -eq 3 || (echo "Failed exit code 3" && exit 1)
          set -e
          echo "✅ Exit code assertions passed."
